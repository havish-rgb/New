
name: JARVIS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JARVIS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate or Extract Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -print -quit)

          if [[ -z "$SETTINGS" ]]; then
            ZIP=""

            for candidate in \
              "JARVIS-source-fixed.zip" \
              "Jarvis final.zip" \
              "Jarvis-fixed.zip" \
              "JARVIS-FULL-SOURCE.zip"; do

              if [[ -f "$candidate" ]]; then
                ZIP="$candidate"
                break
              fi
            done

            if [[ -z "$ZIP" ]]; then
              echo "ERROR: No JARVIS ZIP found!"
              find . -maxdepth 4 -type f
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/jarvis-project"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/jarvis-project"

            SETTINGS=$(find "$RUNNER_TEMP/jarvis-project" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)
          fi

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && \
                ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: Android app Gradle file missing!"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
