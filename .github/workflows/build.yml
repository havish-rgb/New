
name: Build JARVIS Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java
  uses: actions/setup-java@v5
  with:
    distribution: temurin
    java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. Check Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      # 5. Prepare Gradle
      - name: Prepare Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in repository root!"
            exit 1
          fi
          chmod +x ./gradlew
          java -version

      # 6. Build Debug APK
      - name: Build JARVIS Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      # 7. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

